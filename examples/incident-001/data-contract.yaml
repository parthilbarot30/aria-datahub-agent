# DataHub Data Contract — raw.payments
# Generated by ARIA — 2024-05-15T02:31:44Z
# This contract WOULD HAVE CAUGHT incident-001 before production.
#
# Prevention gap identified by ARIA:
#   No schema assertion existed on raw.payments for critical columns.
#   When 'payment_method' was renamed to 'payment_method_v2', no check
#   blocked the schema change from propagating to downstream dbt models.
#
# To register: datahub ingest -c data-contract.yaml

id: "contract-raw-payments-v1"
version: "1.0"
description: "Upstream data contract for raw.payments. Enforces critical column presence, freshness SLA, and volume checks."

entity:
  urn: "urn:li:dataset:(urn:li:dataPlatform:snowflake,raw.payments,PROD)"

schema:
  description: "Critical columns that downstream models depend on. Any rename or removal must be coordinated."
  assertions:
    - column: "payment_id"
      required: true
      type: "STRING"
      description: "Primary key — must never be null or renamed"

    - column: "order_id"
      required: true
      type: "STRING"
      description: "Foreign key to raw.orders"

    - column: "payment_method"
      required: true
      type: "STRING"
      description: |
        CRITICAL: 3 downstream models reference this column.
        Any rename requires coordinated migration — do not rename without opening a PR
        against fct_revenue, monthly_revenue_rollup, and ml_training_features first.

    - column: "amount"
      required: true
      type: "DOUBLE"
      description: "Revenue amount — must be non-null"

    - column: "status"
      required: true
      type: "STRING"
      description: "Payment status enum"

    - column: "created_at"
      required: true
      type: "TIMESTAMP"
      description: "Event timestamp — required for freshness checks"

freshness:
  description: "raw.payments must be refreshed from the payments microservice every hour."
  assertions:
    - maxAge: "PT2H"
      column: "created_at"
      description: "Data must not be older than 2 hours — SLA from payments team"
      onViolation: PAGE_OWNER

quality:
  assertions:
    - id: "no-null-payment-id"
      sql: "SELECT COUNT(*) FROM raw.payments WHERE payment_id IS NULL"
      operator: EQUAL_TO
      value: 0
      description: "Primary key must never be null"

    - id: "no-empty-table"
      sql: "SELECT COUNT(*) FROM raw.payments WHERE created_at >= DATEADD(hour, -24, CURRENT_TIMESTAMP)"
      operator: GREATER_THAN
      value: 1000
      description: "At least 1000 payments must arrive per 24h window"

    - id: "valid-status-values"
      sql: |
        SELECT COUNT(*) FROM raw.payments
        WHERE status NOT IN ('PENDING', 'COMPLETED', 'FAILED', 'CANCELLED', 'REFUNDED')
      operator: EQUAL_TO
      value: 0
      description: "Status must be one of the known enum values"

contact:
  owners:
    - team: "payments-data-eng"
    - user: "data-platform-oncall"
  slack: "#data-incidents"
  pagerduty: "payments-data-team"
  onViolation: PAGE_OWNER
  escalationPolicy: "page-after-15-minutes"