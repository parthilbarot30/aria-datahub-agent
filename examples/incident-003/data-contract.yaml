# DataHub Data Contract — ml_features_prod
# Generated by ARIA — 2024-05-15T03:12:18Z
# This contract WOULD HAVE CAUGHT incident-003 before production.
#
# Prevention gap identified by ARIA:
#   No schema assertion existed on ml_features_prod for ML-critical columns.
#   When user_churn_score_v3 was deprecated, no check blocked the schema change
#   from propagating to downstream training jobs.

id: "contract-ml-features-prod-v1"
version: "1.0"
description: "Data contract for ml_features_prod feature store. Enforces ML-critical column presence and quality."

entity:
  urn: "urn:li:dataset:(urn:li:dataPlatform:snowflake,ml_features_prod,PROD)"

schema:
  assertions:
    - column: "customer_id"
      required: true
      type: "STRING"
      description: "Primary key — must never be null or renamed"

    - column: "user_churn_score_v2"
      required: true
      type: "DOUBLE"
      description: "Current churn score column. Any deprecation requires coordinated migration with ML team."

    - column: "user_engagement_score"
      required: true
      type: "DOUBLE"
      description: "Engagement score — referenced by 3 models"

    - column: "ltv_30d"
      required: true
      type: "DOUBLE"
      description: "30-day LTV feature"

freshness:
  assertions:
    - maxAge: "PT48H"
      description: "Feature store must be refreshed at least every 48 hours for model training"
      onViolation: PAGE_OWNER

quality:
  assertions:
    - id: "no-null-customer-id"
      sql: "SELECT COUNT(*) FROM ml_features_prod WHERE customer_id IS NULL"
      operator: EQUAL_TO
      value: 0
      description: "Primary key must never be null"

    - id: "valid-churn-score-range"
      sql: "SELECT COUNT(*) FROM ml_features_prod WHERE user_churn_score_v2 < 0 OR user_churn_score_v2 > 1"
      operator: EQUAL_TO
      value: 0
      description: "Churn score must be a probability between 0 and 1"

    - id: "minimum-row-count"
      sql: "SELECT COUNT(*) FROM ml_features_prod"
      operator: GREATER_THAN
      value: 10000
      description: "Feature store must have at least 10k rows for valid model training"

contact:
  owners:
    - team: "ml-platform"
    - team: "data-engineering"
  slack: "#ml-incidents"
  onViolation: PAGE_OWNER