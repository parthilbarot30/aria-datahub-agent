# DataHub Data Contract — analytics.fct_daily_revenue
# Generated by ARIA — 2024-05-15T02:31:44Z
# This contract WOULD HAVE CAUGHT incident-002 before production.
#
# Prevention gap identified by ARIA:
#   No freshness assertion existed on fct_daily_revenue.
#   The upstream ingestion DAG failed silently for 36 hours with no alert.
#   A freshness SLA of PT24H would have paged the on-call engineer within 1 hour.

id: "contract-fct-daily-revenue-v1"
version: "1.0"
description: "Data contract for fct_daily_revenue. Enforces freshness SLA and revenue quality checks."

entity:
  urn: "urn:li:dataset:(urn:li:dataPlatform:dbt,analytics.fct_daily_revenue,PROD)"

schema:
  assertions:
    - column: "revenue_date"
      required: true
      type: "DATE"
      description: "Revenue date must never be null"

    - column: "daily_revenue"
      required: true
      type: "NUMERIC"
      description: "Daily revenue must never be null"

freshness:
  assertions:
    - maxAge: "PT24H"
      column: "revenue_date"
      description: "Table must be refreshed at least once per day — SLA from finance team"
      onViolation: PAGE_OWNER

quality:
  assertions:
    - id: "no-negative-revenue"
      sql: "SELECT COUNT(*) FROM analytics.fct_daily_revenue WHERE daily_revenue < 0"
      operator: EQUAL_TO
      value: 0
      description: "Daily revenue must never be negative"

    - id: "no-empty-table"
      sql: "SELECT COUNT(*) FROM analytics.fct_daily_revenue WHERE revenue_date >= DATEADD(day, -7, CURRENT_DATE)"
      operator: GREATER_THAN
      value: 0
      description: "Table must have data for the last 7 days"

    - id: "no-future-dates"
      sql: "SELECT COUNT(*) FROM analytics.fct_daily_revenue WHERE revenue_date > CURRENT_DATE"
      operator: EQUAL_TO
      value: 0
      description: "No future-dated revenue records"

contact:
  owners:
    - team: "data-engineering"
    - team: "finance-analytics"
  slack: "#data-incidents"
  onViolation: PAGE_OWNER
  escalationPolicy: "page-after-15-minutes"